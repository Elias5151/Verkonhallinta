name: hamk-verkonhallinta-golden

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:

  nodes:

    ####################################################
    # ROUTERS
    ####################################################

    r1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ../configs/frr/r1/daemons:/etc/frr/daemons
        - ../configs/frr/r1/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.conf.all.rp_filter=0
        - sysctl -w net.ipv4.conf.default.rp_filter=0
        - ip route replace default via 172.20.20.1
        - iptables -t nat -A POSTROUTING -s 10.10.10.0/24 -o eth0 -j MASQUERADE
        - iptables -A FORWARD -i eth2 -o eth0 -j ACCEPT
        - iptables -A FORWARD -i eth3 -o eth0 -j ACCEPT
        - iptables -A FORWARD -i eth0 -o eth2 -m state --state ESTABLISHED,RELATED -j ACCEPT
        - iptables -A FORWARD -i eth0 -o eth3 -m state --state ESTABLISHED,RELATED -j ACCEPT

    r2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ../configs/frr/r2/daemons:/etc/frr/daemons
        - ../configs/frr/r2/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.conf.all.rp_filter=0
        - sysctl -w net.ipv4.conf.default.rp_filter=0
        - iptables -t nat -A POSTROUTING -s 10.10.20.0/24 -o eth0 -j MASQUERADE
        - iptables -A FORWARD -i eth2 -o eth0 -j ACCEPT
        - iptables -A FORWARD -i eth3 -o eth0 -j ACCEPT
        - iptables -A FORWARD -i eth4 -o eth0 -j ACCEPT
        - iptables -A FORWARD -i eth0 -o eth2 -m state --state ESTABLISHED,RELATED -j ACCEPT
        - iptables -A FORWARD -i eth0 -o eth3 -m state --state ESTABLISHED,RELATED -j ACCEPT
        - iptables -A FORWARD -i eth0 -o eth4 -m state --state ESTABLISHED,RELATED -j ACCEPT

    r3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ../configs/frr/r3/daemons:/etc/frr/daemons
        - ../configs/frr/r3/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.conf.all.rp_filter=0
        - sysctl -w net.ipv4.conf.default.rp_filter=0
        - iptables -t nat -A POSTROUTING -s 10.10.30.0/24 -o eth0 -j MASQUERADE
        - iptables -A FORWARD -i eth2 -o eth0 -j ACCEPT
        - iptables -A FORWARD -i eth0 -o eth2 -m state --state ESTABLISHED,RELATED -j ACCEPT

    ####################################################
    # USER NETWORK
    ####################################################

    client1:
      kind: linux
      image: ubuntu:24.04
      exec:
        - ip addr add 10.10.10.101/24 dev eth1
        - ip route add default via 10.10.10.1
        - sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'

    attacker:
      kind: linux
      image: kalilinux/kali-rolling:latest
      exec:
        - ip addr add 10.10.10.200/24 dev eth1
        - ip route add default via 10.10.10.1

    ####################################################
    # SERVER NETWORK
    ####################################################

    web1:
      kind: linux
      image: ubuntu:24.04
      exec:
        - ip addr add 10.10.20.101/24 dev eth1
        - ip route add default via 10.10.20.1
        - sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'

    db1:
      kind: linux
      image: ubuntu:24.04
      exec:
        - ip addr add 10.10.20.102/24 dev eth1
        - ip route add default via 10.10.20.1
        - sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'

    ####################################################
    # BRANCH OFFICE
    ####################################################

    branch-client:
      kind: linux
      image: ubuntu:24.04
      exec:
        - ip addr add 10.10.30.101/24 dev eth1
        - ip route add default via 10.10.30.1
        - sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'

    ####################################################
    # MANAGEMENT SERVICES
    ####################################################

    ansible:
      kind: linux
      image: ubuntu:24.04
      binds:
        - ../configs/ansible:/ansible

    prometheus:
      kind: linux
      image: prom/prometheus:latest
      ports:
        - 9090:9090
      binds:
        - ../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    grafana:
      kind: linux
      image: grafana/grafana:latest
      ports:
        - 3000:3000

    zabbix:
      kind: linux
      image: zabbix/zabbix-appliance:latest
      ports:
        - 8080:80
        - 10051:10051

  ####################################################
  # LINKS
  ####################################################

  links:

    #
    # R1 <---> R2
    #
    - endpoints: ["r1:eth1", "r2:eth1"]

    #
    # R2 <---> R3
    #
    - endpoints: ["r2:eth4", "r3:eth1"]

    #
    # USER LAN
    #
    - endpoints: ["r1:eth2", "client1:eth1"]
    - endpoints: ["r1:eth3", "attacker:eth1"]

    #
    # SERVER LAN
    #
    - endpoints: ["r2:eth2", "web1:eth1"]
    - endpoints: ["r2:eth2", "db1:eth1"]

    #
    # MANAGEMENT LAN
    #
    - endpoints: ["r2:eth3", "ansible:eth1"]
    - endpoints: ["r2:eth3", "prometheus:eth1"]
    - endpoints: ["r2:eth3", "grafana:eth1"]
    - endpoints: ["r2:eth3", "zabbix:eth1"]

    #
    # BRANCH OFFICE LAN
    #
    - endpoints: ["r3:eth2", "branch-client:eth1"]